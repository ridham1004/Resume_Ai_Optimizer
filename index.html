<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>AI Tailor - Main Workspace</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Space_Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#e1e2eb",
                        "on-primary-fixed-variant": "#842500",
                        "on-primary-fixed": "#3a0b00",
                        "inverse-surface": "#e1e2eb",
                        "surface-container-high": "#272a31",
                        "error": "#ffb4ab",
                        "tertiary": "#a4c9ff",
                        "on-error": "#690005",
                        "inverse-primary": "#ad3300",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#004884",
                        "surface-bright": "#363940",
                        "primary-container": "#ff5717",
                        "error-container": "#93000a",
                        "surface": "#10131a",
                        "on-secondary-fixed-variant": "#832602",
                        "primary-fixed-dim": "#ffb59e",
                        "on-tertiary-container": "#002a52",
                        "tertiary-fixed-dim": "#a4c9ff",
                        "primary-fixed": "#ffdbd0",
                        "on-tertiary-fixed": "#001c39",
                        "outline": "#ac897e",
                        "background": "#10131a",
                        "on-tertiary": "#00315d",
                        "secondary": "#ffb59e",
                        "on-surface-variant": "#e6beb2",
                        "surface-container-low": "#191c22",
                        "secondary-container": "#862804",
                        "surface-container": "#1d2026",
                        "surface-container-lowest": "#0b0e14",
                        "outline-variant": "#5c4037",
                        "on-secondary-container": "#ffa082",
                        "primary": "#ffb59e",
                        "inverse-on-surface": "#2e3037",
                        "secondary-fixed": "#ffdbd0",
                        "on-primary": "#5e1700",
                        "surface-tint": "#ffb59e",
                        "secondary-fixed-dim": "#ffb59e",
                        "on-primary-container": "#521300",
                        "on-secondary-fixed": "#3a0b00",
                        "surface-variant": "#32353c",
                        "surface-dim": "#10131a",
                        "surface-container-highest": "#32353c",
                        "tertiary-fixed": "#d4e3ff",
                        "on-secondary": "#5e1700",
                        "on-surface": "#e1e2eb",
                        "tertiary-container": "#1c92ff"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Space Grotesk"]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .glass-panel {
            background: rgba(50, 53, 60, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>

<body class="bg-surface-container-lowest text-on-surface font-body selection:bg-primary selection:text-on-primary">
    <nav
        class="bg-[#10131A]/60 backdrop-blur-xl docked full-width top-0 z-50 sticky shadow-[0_40px_60px_-5px_rgba(225,226,235,0.04)]">
        <div class="flex justify-between items-center w-full px-8 py-4 max-w-[1920px] mx-auto">
            <div class="flex items-center gap-6">
                <span class="text-xl font-black text-[#FFB59E] tracking-tighter font-headline">Resume AI
                    Optimizer</span>
                <div class="hidden md:flex items-center">
                    <span
                        class="px-3 py-1 bg-surface-container-high rounded-full text-[10px] font-label font-bold text-primary tracking-widest uppercase border border-outline-variant/20">
                        Innovate Beyond Boundaries
                    </span>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-[1400px] mx-auto px-8 py-12 flex flex-col gap-12">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass-panel p-8 rounded-xl border border-outline-variant/10 flex flex-col gap-6">
                <div class="flex items-center justify-between">
                    <h2 class="font-headline font-bold text-xl tracking-tight flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">target</span>
                        Target Job Description
                    </h2>
                    <span
                        class="font-label text-[10px] text-on-surface-variant tracking-widest uppercase">Required</span>
                </div>
                <div class="relative group">
                    <textarea id="jd-input"
                        class="w-full h-[480px] bg-surface-container-low border border-outline-variant/15 rounded-xl p-6 text-on-background font-body text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all resize-none placeholder:text-gray-600"
                        placeholder="Paste the complete job posting here..."></textarea>
                </div>
            </div>
            <div class="flex flex-col gap-8">
                <div class="glass-panel p-8 rounded-xl border border-outline-variant/10 flex flex-col gap-6 h-full">
                    <div class="flex items-center justify-between">
                        <h2 class="font-headline font-bold text-xl tracking-tight flex items-center gap-3">
                            <span class="material-symbols-outlined text-tertiary">database</span>
                            Your Data Pool
                        </h2>
                        <span
                            class="font-label text-[10px] text-on-surface-variant tracking-widest uppercase">Contextual
                            Inputs</span>
                    </div>
                    <div class="flex flex-col gap-6 h-full">
                        <div class="flex flex-col gap-3">
                            <label
                                class="font-label text-xs font-bold text-on-surface-variant uppercase tracking-wider">Your
                                Skills</label>
                            <textarea id="skills-input"
                                class="w-full h-[120px] bg-surface-container-low border border-outline-variant/15 rounded-xl p-4 text-on-background font-body text-xs focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all resize-none">- Languages & Scripting: C, Kotlin, JavaScript/TypeScript, Java, Bash, VHDL, JavaCC
- AI & Machine Learning: Python (PyTorch, Pandas, NumPy), LLM APIs
- Full-Stack: React, Node.js, Git, Docker, CI/CD, Kubernetes, Firebase, Postman
- Network: Zeek, Elasticsearch, Logstash, Kibana (ELK Stack), Wireshark</textarea>
                        </div>
                        <div class="flex flex-col gap-3 h-full">
                            <label
                                class="font-label text-xs font-bold text-on-surface-variant uppercase tracking-wider">Your
                                Experiences</label>
                            <textarea id="exp-input"
                                class="w-full flex-grow bg-surface-container-low border border-outline-variant/15 rounded-xl p-4 text-on-background font-body text-xs focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all resize-none">1. Vector-Matrix DSL Compiler | Java, JavaCC, JJTree, Bash 
2. Mini SIEM | Zeek, Filebeat, Elasticsearch, Logstash, Kibana 
3. General Purpose Processor (ALU) | Quartus, VHDL, FPGA 
4. CUAI -- Custodial Management AI | DMZ Basecamp 2025 Cohort 
5. AppliFlow | JavaScript, Postman, Firebase, Next.js, Google APIs
6. Carpool Matching System | Python (NumPy, Pandas, Geopy), SQL
7. International Commissioner | MUES | TMU
8. Engineering ACES Peer Tutor | FEAS | TMU</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex flex-col items-center gap-8 py-4">
            <button id="generate-btn"
                class="group relative bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-headline font-black text-lg py-5 px-12 rounded-xl flex items-center gap-4 transition-all hover:shadow-[0_0_40px_rgba(255,181,158,0.2)] active:scale-95">
                <span class="material-symbols-outlined group-hover:rotate-12 transition-transform">magic_button</span>
                Generate Tailored Workspace
            </button>
        </div>
        <div id="output-panel" class="w-full max-w-4xl mx-auto hidden">
            <div
                class="bg-surface-container border border-outline-variant/20 rounded-xl p-8 flex flex-col md:flex-row items-center justify-between gap-8 shadow-2xl relative overflow-hidden">
                <div class="absolute -left-20 -top-20 w-40 h-40 bg-primary/10 blur-[100px]"></div>
                <div class="flex items-center gap-6 z-10">
                    <div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary">check_circle</span>
                    </div>
                    <div>
                        <h3 class="font-headline font-bold text-lg">Assets Generated Successfully</h3>
                        <p class="text-on-surface-variant text-sm">Your tailored documents are in your project folder.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const jd = document.getElementById('jd-input').value;
            const skills = document.getElementById('skills-input').value;
            const exp = document.getElementById('exp-input').value;
            const btn = document.getElementById('generate-btn');
            const outputPanel = document.getElementById('output-panel');

            if (!jd.trim()) {
                alert('Please paste a Job Description first!');
                return;
            }

            // Combine inputs to match your Python backend's single 'data_pool' expectation
            const combinedDataPool = `*** SKILLS ***\n${skills}\n\n*** EXPERIENCES ***\n${exp}`;

            // UI Loading State
            const originalBtnHTML = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Processing via Vertex AI...';
            btn.disabled = true;
            outputPanel.classList.add('hidden'); // Hide output if running again

            try {
                // Send data to your FastAPI backend
                const response = await fetch('http://localhost:8000/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        job_description: jd,
                        data_pool: combinedDataPool
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log("Success:", data);

                    // Show the success panel and scroll down
                    outputPanel.classList.remove('hidden');
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                } else {
                    alert('Generation failed! Check your Python terminal for errors.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Could not connect to the backend. Make sure your uvicorn server is running!');
            } finally {
                // Restore button state
                btn.innerHTML = originalBtnHTML;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
